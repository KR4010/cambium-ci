# Cambium — CI / CD
#
# This workflow lives in a PUBLIC repository and checks out the PRIVATE app repo
# with a PAT. That split is the whole point: public repositories get GitHub Actions
# minutes for free, macOS runners included, while a private repo on the free plan
# gets roughly 200 macOS minutes a month. One iOS build eats a good share of that.
#
# Builds run with `eas build --local`, so they consume no EAS build credits either —
# the runner does the work and EAS only supplies credentials and submission.

name: Cambium CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      build:
        type: choice
        description: What to build
        default: none
        options: [none, ios, android, all]
      submit:
        type: boolean
        description: Submit the iOS build to TestFlight
        default: true
      profile:
        type: choice
        description: >-
          production ships the real thing. testflight bypasses the paywall so the app
          behind it can be tested, and must never be promoted to App Store review.
        default: production
        options: [production, testflight]

permissions:
  contents: read

env:
  APP_REPO: KR4010/cambium
  # A push always builds the real thing. Only a deliberate dispatch can bypass.
  BUILD_PROFILE: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
  # Node 20 reached end of life in April 2026 and GitHub now force-runs actions that
  # target it on a newer runtime. 22 is LTS and is what Expo SDK 54 supports.
  NODE_VERSION: '22'

jobs:
  # ── Gate ───────────────────────────────────────────────────────────────────
  # Nothing is built until the code is known good. These are the same four
  # commands used locally, so a green CI means exactly what a green terminal does.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.APP_REPO_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint --max-warnings 0

      - name: Test
        run: npm test -- --ci

      - name: Bundle
        # Catches what typecheck cannot: a module that resolves at build time but
        # not at runtime. Cheaper to find here than on a device.
        run: npx expo export --platform ios --output-dir /tmp/bundle-check

  # ── iOS ────────────────────────────────────────────────────────────────────
  ios:
    needs: checks
    runs-on: macos-latest
    timeout-minutes: 90
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.build == 'ios' || inputs.build == 'all'))
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.APP_REPO_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm install -g eas-cli

      - name: Verify EAS auth
        # Fail here with a clear cause rather than 40 minutes into a build.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Preflight — every credential the run will need
        # Checked before a minute of compile time is spent. A missing secret that only
        # surfaces at the submit step costs a twelve-minute build to discover.
        env:
          RC_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_KEY_IOS }}
          SB_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ASC_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          WILL_SUBMIT: ${{ github.event_name == 'push' || inputs.submit }}
        run: |
          missing=0
          if [ -z "$RC_KEY" ]; then
            echo "::error::EXPO_PUBLIC_REVENUECAT_KEY_IOS is not set. A release build without it ships a dead paywall."
            missing=1
          fi
          # Not fatal: the app is designed to run without accounts, and Friends is the
          # only surface that needs them. Warn loudly rather than block a build.
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::warning::Supabase is not configured. Accounts and Friends will be unavailable in this build."
          fi
          if [ "$WILL_SUBMIT" = "true" ]; then
            for name in ASC_P8 ASC_KEY_ID ASC_ISSUER_ID; do
              if [ -z "${!name}" ]; then
                echo "::error::App Store Connect secret $name is not set. Submission cannot authenticate unattended — see docs/RELEASE.md."
                missing=1
              fi
            done
            # Fail here rather than after the build if the key is not decodable.
            if [ -n "$ASC_P8" ] && ! printf '%s' "$ASC_P8" | base64 --decode > /dev/null 2>&1; then
              echo "::error::ASC_API_KEY_P8_BASE64 is not valid base64. Re-encode with: base64 -i AuthKey_XXXX.p8"
              missing=1
            fi
          fi
          [ "$missing" = "0" ] || exit 1
          echo "All required credentials present."

      - name: Refuse a production build that carries the tester bypass
        # eas.json sets the flag only on the testflight profile. This guards against
        # it being pasted into production by hand.
        run: |
          if [ "$BUILD_PROFILE" = "production" ] && node -e "process.exit(require('./eas.json').build.production.env?.EXPO_PUBLIC_TESTER_BUILD ? 0 : 1)"; then
            echo "::error::The production profile sets EXPO_PUBLIC_TESTER_BUILD. A shippable build must never bypass the paywall."
            exit 1
          fi
          if [ "$BUILD_PROFILE" = "testflight" ]; then
            echo "::warning::TESTER profile — the paywall is bypassed. This build must NOT be promoted to App Store review."
          fi
          echo "Profile: $BUILD_PROFILE"

      - name: Build (local)
        # Apple credentials belong here, not only on the submit step. Without them EAS
        # cannot authenticate with Apple mid-build, so it silently reuses whatever
        # provisioning profile it already has — and any native module that adds an
        # entitlement (push, Sign in with Apple) then fails at the archive with
        # "profile does not support the X capability", no matter how many capabilities
        # are enabled on the App ID. The tell in the log is:
        #   "Failed to display prompt: Apple Team ID" followed by
        #   "Skipping Provisioning Profile validation ... we aren't authenticated".
        # With these set, EAS regenerates the profile to match the entitlements.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_REVENUECAT_KEY_IOS: ${{ secrets.EXPO_PUBLIC_REVENUECAT_KEY_IOS }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          NODE_ENV: production
        run: |
          # Same handling as the submit step: the key reaches disk only for the build's
          # lifetime and is shredded by the step below, which runs even on failure.
          export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/asc-api-key-build.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$EXPO_ASC_API_KEY_PATH"
          chmod 600 "$EXPO_ASC_API_KEY_PATH"
          eas build \
            --platform ios \
            --profile "$BUILD_PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/cambium.ipa"

      - name: Keep the build
        uses: actions/upload-artifact@v5
        with:
          name: cambium-ios-${{ env.BUILD_PROFILE }}-${{ github.run_number }}
          path: ${{ runner.temp }}/cambium.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Submit to TestFlight
        if: github.event_name == 'push' || inputs.submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # An App Store Connect API Key, supplied entirely from secrets. Apple ID
          # sign-in is deliberately not used: it requires 2FA and cannot complete
          # unattended, which is why the key exists.
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_TEAM_ID }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: |
          # Presence was checked in preflight. The private key never reaches the log
          # and never touches the workspace.
          export EXPO_ASC_API_KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$EXPO_ASC_API_KEY_PATH"
          chmod 600 "$EXPO_ASC_API_KEY_PATH"
          eas submit \
            --platform ios \
            --profile "$BUILD_PROFILE" \
            --path "$RUNNER_TEMP/cambium.ipa" \
            --non-interactive

      - name: Shred the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/asc-api-key-build.p8"

  # ── Android ────────────────────────────────────────────────────────────────
  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.build == 'android' || inputs.build == 'all')
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.APP_REPO_PAT }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci
      - run: npm install -g eas-cli

      - name: Build (local)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_REVENUECAT_KEY_ANDROID: ${{ secrets.EXPO_PUBLIC_REVENUECAT_KEY_ANDROID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: production
        run: |
          eas build \
            --platform android \
            --profile "$BUILD_PROFILE" \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/cambium.aab"

      - name: Keep the build
        uses: actions/upload-artifact@v5
        with:
          name: cambium-android-${{ github.run_number }}
          path: ${{ runner.temp }}/cambium.aab
          retention-days: 14
          if-no-files-found: error
